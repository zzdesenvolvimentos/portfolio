<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acesso Restrito — ONG Solidária</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="top-header">
    <div class="container header-container">
      <div class="brand-wrapper">
        <img src="imagens/logo.jpg" alt="Logo ONG" class="logo" onerror="this.src='https://images.unsplash.com/photo-1532629345422-7515f3d16bb0?auto=format&fit=crop&w=150&q=80'">
        <div>
          <span class="brand-title">ONG Solidária</span>
          <span class="brand-subtitle">Área Administrativa</span>
        </div>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <div class="container">
      <ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Nossos Projetos</a></li>
        <li><a href="voluntarios.html">Seja Voluntário</a></li>
        <li><a href="doacoes.html">Apoie/Doações</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="login.html">Painel Restrito</a></li>
      </ul>
    </div>
  </nav>

  <section class="content-section container">
    <div class="section-header">
      <span class="section-subtitle">Área Reservada</span>
      <h2 class="section-title">Login de Colaboradores</h2>
    </div>

    <div class="form-card">
      <form id="form-login">
        <div class="form-group">
          <label for="email">E-mail Institucional:</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="admin@ongsolidaria.org" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha de Acesso:</label>
          <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; justify-content: center; margin-top: 1rem;">
          <i data-lucide="lock"></i> Acessar Painel
        </button>
      </form>
    </div>
  </section>

  <footer class="main-footer">
    <div class="container footer-credits">
      <p>&copy; 2026 ONG Solidária. Desenvolvido por <strong>Z&Z Desenvolvimentos</strong>.</p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
